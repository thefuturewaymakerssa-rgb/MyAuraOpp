version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automated
    # Only alert on minor+ updates — patch updates are too noisy
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    # Group all devDependency updates into a single PR
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
