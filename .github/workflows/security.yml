name: Security Scan

on:
  schedule:
    # Every Monday 07:00 Johannesburg time (05:00 UTC)
    - cron: '0 5 * * 1'
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (block on high/critical)
        run: npm audit --audit-level=high
        # This step fails CI if any high or critical vulnerability is found.
        # To fix: run `npm audit fix` or pin a patched version.

      - name: Check for known secret leaks (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  smoke-test:
    name: Smoke Test (Production Check)
    runs-on: ubuntu-latest
    # Only run smoke test on pushes to main (not on PRs — no secrets available)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_MERCHANT_ID }}
      PAYFAST_MERCHANT_KEY: ${{ secrets.PAYFAST_MERCHANT_KEY }}
      PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_PASSPHRASE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (required for sw.js check)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: dummy_for_build
          UPSTASH_REDIS_REST_URL: https://dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN: dummy_token
          CRON_SECRET: dummy_secret
          PAYSTACK_SECRET_KEY: dummy
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: dummy
          SENTRY_DSN: https://dummy@sentry.io/0
          PAYFAST_MERCHANT_ID: "10000100"
          PAYFAST_MERCHANT_KEY: dummy
          PAYFAST_PASSPHRASE: dummy
          OPENAI_API_KEY: sk-placeholder

      - name: Run smoke tests
        run: node scripts/smoke-test.js
