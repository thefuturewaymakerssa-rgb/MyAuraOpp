name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Type-Check, Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (zero warnings)
        run: npm run lint

      - name: TypeScript type-check
        run: npm run type-check

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test
        # Continues even if no tests exist yet — tests added in Sprint 3
        continue-on-error: true

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Dummy values for secrets not needed at build time
          SUPABASE_SERVICE_ROLE_KEY: dummy_for_build
          UPSTASH_REDIS_REST_URL: https://dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN: dummy_token
          CRON_SECRET: dummy_secret
          PAYSTACK_SECRET_KEY: dummy_paystack
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: dummy_paystack_pub
          SENTRY_DSN: https://dummy@sentry.io/0

  preview:
    name: Vercel Preview Deploy
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Preview to Vercel
        uses: vercel/action@v1
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
